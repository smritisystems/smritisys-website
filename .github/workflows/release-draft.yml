name: Draft GitHub Release

on:
  push:
    tags:
      - smritisys-control-plane-v*
      - smritisys-public-website-v*

permissions:
  contents: write

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-draft:
    if: startsWith(github.ref, 'refs/tags/smritisys-control-plane-v') || startsWith(github.ref, 'refs/tags/smritisys-public-website-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tags must point to a commit already contained in main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Build CSS
        run: npm run build:css

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --target "$RELEASE_SHA"
